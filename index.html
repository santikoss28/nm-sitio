<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nicole Montes · Abogada, turismo y café del Huila</title>
<meta name="description" content="Asesoría jurídica, planes de viaje por el Huila y café de especialidad de la Asociación Montaña Luminosa.">
<meta property="og:type" content="website">
<meta property="og:title" content="Nicole Montes · Abogada, turismo y café del Huila">
<meta property="og:description" content="Asesoría jurídica, planes de viaje por el Huila y café de especialidad de la Asociación Montaña Luminosa.">
<meta name="theme-color" content="#0d3b4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="inicio">
<div id="site-header"></div>
<main>

  <section class="band hero hero-home">
    <div class="wrap">
      <img class="logo-full" src="img/nm-logo-claro.png" alt="Logo de Nicole Montes: monograma NM sobre una montaña. Abogada, turismo, café" width="560" height="377">
      <h1 id="hero-title"></h1>
      <p class="lead" id="hero-text"></p>
    </div>
    <svg class="ridge" viewBox="0 0 1200 110" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path d="M0 110 L0 78 L90 52 L170 70 L280 24 L370 62 L470 36 L560 74 L680 18 L770 58 L860 40 L960 72 L1060 34 L1130 56 L1200 44 L1200 110 Z"/>
    </svg>
  </section>

  <section id="areas">
    <div class="wrap">
      <div class="doors" id="doors"></div>
    </div>
  </section>

  <section class="section story-sec" id="quien">
    <div class="wrap">
      <p class="eyebrow">Sobre NM</p>
      <h2 id="about-title"></h2>
      <div class="about-grid">
        <img src="img/nm-simbolo.png" alt="Monograma NM sobre una montaña" width="340" height="146">
        <div id="about-text"></div>
      </div>
    </div>
  </section>

  <section class="section trust">
    <div class="wrap">
      <p class="eyebrow">Para elegir con tranquilidad</p>
      <h2>Lo que puedes esperar</h2>
      <div class="proofs-home" id="proofs"></div>
    </div>
  </section>

  <section class="section" id="contacto">
    <div class="wrap">
      <p class="eyebrow">Contacto</p>
      <h2>Escríbenos y cuéntanos qué necesitas</h2>
      <p class="intro">Una conversación por WhatsApp basta para empezar: asesoría, un viaje o tu pedido de café.</p>
      <div class="contact">
        <a class="btn btn-solid arrow" id="contact-wa" href="#" target="_blank" rel="noopener">Escribir por WhatsApp</a>
        <span id="contact-extra" style="display:contents"></span>
      </div>
    </div>
  </section>

</main>
<div id="site-footer"></div>
<script src="contenido.js"></script>
<script src="site.js"></script>
</body>
</html>
